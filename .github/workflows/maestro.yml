name: Maestro E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [mobile/**]
  pull_request:
    branches: [main]
    paths: [mobile/**]

jobs:
  maestro-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Free disk space — the Gradle build + Android emulator need ~15GB+
      # and GitHub runners only have ~17-22GB free after preinstalled tools.
      # Remove large preinstalled components we don't need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Enable KVM for hardware-accelerated emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "system-images;android-34;google_apis;x86_64" "emulator"

      # Restore cached APK — native build only needs to re-run when native
      # deps or app config change, not for JS-only changes (~26 min saved).
      # Uses cache/restore + explicit cache/save (instead of cache@v4) because
      # the post-job save doesn't run when the job is cancelled by timeout.
      - name: Restore cached APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}

      - name: Generate native project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android
        working-directory: mobile

      - name: Restore Gradle cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Stop Gradle daemon
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop
        working-directory: mobile/android

      # Save caches immediately after build — don't rely on post-job which
      # won't run if the job is cancelled (e.g. by timeout).
      - name: Save APK cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}

      - name: Save Gradle cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}

      - name: Restore Maestro CLI cache
        id: maestro-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.maestro
          key: maestro-cli-v1

      - name: Install Maestro CLI
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Save Maestro CLI cache
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.maestro
          key: maestro-cli-v1

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          ram-size: 1536M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: bash mobile/ci/run-maestro.sh

      # Capture diagnostics BEFORE uploading artifacts so screenshots and
      # logcat are included in the main maestro-results artifact.
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/maestro-screenshots
          adb exec-out screencap -p > /tmp/maestro-screenshots/failure.png || true
          adb logcat -d -t 200 ReactNativeJS:* *:E > /tmp/maestro-screenshots/logcat.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests/
            /tmp/maestro-screenshots/
