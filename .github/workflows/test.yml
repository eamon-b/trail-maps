name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint

  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # React Native 0.86 (Expo SDK 57) declares
          # node ^20.19.4 || ^22.13.0 || ^24.3.0 || >= 25. Plain "20" floats to
          # whatever 20.x the runner has, which can land below that floor.
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run lint
