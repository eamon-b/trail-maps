name = "contour-tiles"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# The custom domain below is the only hostname: the workers.dev URL was retired
# (issue #159) once no distributed build predated the custom domains
# (2026-08-22), so every shipped build points at tiles.contour-map-tiles.net.
workers_dev = false

# --- Custom domain (enables real edge caching) --------------------------------
# The Worker calls caches.default, which is a NO-OP on *.workers.dev (a shared
# zone) and live on this custom domain, a zone in this account.
#
# Public hostnames for the tileset (zone: contour-map-tiles.net):
#   contour-map-tiles.net       → docs + demo (Cloudflare Pages)
#   data.contour-map-tiles.net  → R2 bucket: the PMTiles archive itself
#   tiles.contour-map-tiles.net → this Worker: /{source}/{z}/{x}/{y}.pbf
[[routes]]
pattern = "tiles.contour-map-tiles.net"
custom_domain = true

[[r2_buckets]]
binding = "TILES_BUCKET"
bucket_name = "aus-map-data"

# Optionally lock CORS down in production:
# [vars]
# ALLOWED_ORIGIN = "https://tracknotes.info"
