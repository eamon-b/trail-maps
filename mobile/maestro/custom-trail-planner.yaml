appId: com.trailcompanion.app
---
# Verify campsite planner is accessible from a trail
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Tap "+ New Plan" on the first trail card
- tapOn: "+ New Plan"
- waitForAnimationToEnd

# Wait for plan creation screen to load
- extendedWaitUntil:
    visible: "New Plan"
    timeout: 10000

# Verify plan creation screen
- assertVisible: "Plan Name"
- assertVisible: "Direction"

# Dismiss keyboard (autoFocus on plan name) and scroll to Create Plan
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create Plan"
    direction: DOWN
    timeout: 5000

# Cancel back
- tapOn: "Cancel"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000
