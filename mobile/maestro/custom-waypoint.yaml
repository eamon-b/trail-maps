appId: com.trailcompanion.app
tags:
  - quarantine
---
# Custom waypoints (issue #6, Phase 4 item 2): long-press the trail map to add
# a waypoint, verify it appears, then delete it via the detail sheet.
#
# QUARANTINED (tag: quarantine) — excluded from the gating CI run via
# `--exclude-tags=quarantine` in mobile/ci/run-maestro.sh. Run it manually with:
#   ~/.maestro/bin/maestro test mobile/maestro/custom-waypoint.yaml
# Why: the long-press snaps the waypoint to the nearest track point, which on a
# full-trail view lands mid-trail. On a 688 km trail (AAWT, the first list item)
# the resulting datasheet row sits hundreds of km down a km-sorted list, deeper
# than scrollUntilVisible can reach within a practical timeout — so this asserts
# unreliably. The underlying add/merge/delete logic is covered by unit tests
# (merge-custom-waypoints.test.ts, custom-waypoints.test.ts). A robust E2E needs
# a scroll-independent check (e.g. auto-pan to the new waypoint's detail sheet).
#
# Known risk: the initial long-press lands on the MapLibre GL canvas; the
# handler snaps to the nearest track point no matter where the press lands,
# so any point over the map works. Everything after the long-press exercises
# native views only.
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View Map"
    timeout: 30000

# Open the first trail (AAWT) and its map
- tapOn: "View Map"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "View waypoint datasheet"
    timeout: 15000

# Long-press the map to open the Add Waypoint sheet
- longPressOn:
    point: "50%, 45%"
- extendedWaitUntil:
    visible: "Add Waypoint"
    timeout: 10000

# Fill in the waypoint: name "My spring", type water, save
- tapOn: "Waypoint name"
- inputText: "My spring"
- hideKeyboard
- tapOn: "Water"
- tapOn: "Save"
- waitForAnimationToEnd

# The trail reloads with the merged waypoint; the map screen comes back
- extendedWaitUntil:
    visible: "View waypoint datasheet"
    timeout: 15000

# Verify the waypoint is in the datasheet (native list). The long-press snaps
# to the nearest track point, which on the full-trail view lands mid-trail, so
# "My spring" is sorted well down the km-ordered list and off the initial
# viewport. assertVisible/extendedWaitUntil do NOT scroll — use
# scrollUntilVisible so the check works wherever the row lands.
- tapOn: "View waypoint datasheet"
- scrollUntilVisible:
    element:
      text: "My spring"
    direction: DOWN
    timeout: 15000
- takeScreenshot: custom-waypoint-added

# Open it on the map to reach the detail sheet with Edit/Delete actions
# (scrollUntilVisible above left the row on-screen).
- tapOn: "My spring"
- waitForAnimationToEnd
- tapOn: "Show on map"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Delete waypoint"
    timeout: 10000
- assertVisible: "Edit waypoint"

# Delete it — deletion is now immediate with an undo toast (P1 PR A);
# exercise the undo round-trip, then delete for real and let the toast expire.
- tapOn: "Delete waypoint"
- extendedWaitUntil:
    visible: "Undo"
    timeout: 5000
- tapOn: "Undo"
- waitForAnimationToEnd

# Undo restored it — the detail sheet can be reached again via the datasheet
- tapOn: "View waypoint datasheet"
- scrollUntilVisible:
    element:
      text: "My spring"
    direction: DOWN
    timeout: 15000
- tapOn: "My spring"
- waitForAnimationToEnd
- tapOn: "Show on map"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Delete waypoint"
    timeout: 10000
- tapOn: "Delete waypoint"
- extendedWaitUntil:
    visible: "Undo"
    timeout: 5000
# Let the 5 s undo window expire so the delete commits
- extendedWaitUntil:
    notVisible: "Undo"
    timeout: 10000
- waitForAnimationToEnd

# Confirm the datasheet still renders after the delete round-trip.
- extendedWaitUntil:
    visible: "View waypoint datasheet"
    timeout: 15000
- tapOn: "View waypoint datasheet"
- extendedWaitUntil:
    visible: "km remaining"
    timeout: 15000
# NOTE: we deliberately do NOT assertNotVisible "My spring" here. On this
# virtualized FlatList (AAWT, 176 rows) the deleted mid-trail row is off-screen
# regardless of whether deletion worked, so the assertion would be a false pass.
# Deletion is guarded reliably by unit tests instead:
#   - custom-waypoints.test.ts ("deletes a custom waypoint", real SQLite)
#   - datasheet-service.test.ts (merged water waypoint appears in the datasheet)
- takeScreenshot: custom-waypoint-deleted
