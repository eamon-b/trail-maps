appId: com.trailcompanion.app
---
# Test deep navigation stack unwinds correctly
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate deep: trail list → overview → map
- tapOn: "View trail →"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Open Map"
    direction: DOWN
    timeout: 10000

- tapOn: "Open Map"
- waitForAnimationToEnd

# Unwind: map → overview (scroll position is preserved from earlier scroll,
# so the trail name may be above the viewport — scroll up to find it)
- pressKey: back
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Australian Alps Walking Track"
    direction: UP
    timeout: 10000

# Unwind: overview → trail list
- pressKey: back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000
