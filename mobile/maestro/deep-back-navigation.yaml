appId: com.trailcompanion.app
---
# Test deep navigation stack unwinds correctly
- launchApp
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate deep: trail list → overview → map
- tapOn: "View trail →"
- waitForAnimationToEnd
- assertVisible: "Open Map"

- tapOn: "Open Map"
- waitForAnimationToEnd

# Unwind: map → overview
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "Open Map"

# Unwind: overview → trail list
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
