appId: com.trailcompanion.app
---
# Verify GPX import screen loads and shows expected UI elements
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Import button is in the Plan tab header
- tapOn: "Import"
- waitForAnimationToEnd

# Verify import screen header and elements
- assertVisible: "Import Trail"
- assertVisible: "Import a GPX file"
- assertVisible: "Choose File"
- assertVisible: "Import from URL"
- assertVisible: "SUPPORTED FILES"

# Toggle URL input and verify it appears
- tapOn: "Import from URL"
- waitForAnimationToEnd
- assertVisible: "Fetch"

# Hide URL input
- tapOn: "Hide URL import"
- waitForAnimationToEnd

# Cancel back
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
