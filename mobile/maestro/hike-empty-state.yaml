appId: com.trailcompanion.app
---
# Verify the Hike tab loads and shows either empty state or active trail
- launchApp
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate to Hike tab
- tapOn: "Hike"
- waitForAnimationToEnd

# On a fresh launch (no trail opened), shows empty state.
# If a trail was previously opened, shows the dashboard.
# Check for empty state (will pass when no trail is active).
- assertVisible:
    text: "No active trail"
    optional: true
- assertVisible:
    text: "Open a trail from the Plan tab"
    optional: true

# Navigate back to Plan tab to verify navigation works
- tapOn: "Plan"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
