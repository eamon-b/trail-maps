appId: com.trailcompanion.app
---
# Test import error handling: open import screen, attempt URL import with invalid URL
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate to import screen
- tapOn: "Import"
- waitForAnimationToEnd
- assertVisible: "Import Trail"

# Show URL input
- tapOn: "Import from URL"
- waitForAnimationToEnd

# Enter an invalid URL
- tapOn:
    id: "urlInput"
- inputText: "not-a-valid-url"

# Tap Fetch — should show error
- tapOn: "Fetch"
- waitForAnimationToEnd

# Verify error state is shown
- extendedWaitUntil:
    visible: "Import Failed"
    timeout: 10000

# Verify retry option
- assertVisible: "Try Again"

# Tap Try Again to go back to pick stage
- tapOn: "Try Again"
- waitForAnimationToEnd

# Verify we're back on the pick screen
- assertVisible: "Choose File"

# Cancel back
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
