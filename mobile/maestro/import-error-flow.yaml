appId: com.trailcompanion.app
---
# Test import error handling: open import screen, attempt URL import with invalid URL
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate to import screen
- tapOn: "Import"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Import Trail"
    timeout: 10000

# Show URL input
- tapOn: "Import from URL"
- waitForAnimationToEnd

# Wait for URL input to expand
- extendedWaitUntil:
    visible:
      id: "urlInput"
    timeout: 5000

# Enter an invalid URL
- tapOn:
    id: "urlInput"
- inputText: "not-a-valid-url"

# Dismiss keyboard so Fetch button is visible
- hideKeyboard

# Tap Fetch — should show error
- extendedWaitUntil:
    visible: "Fetch"
    timeout: 5000
- tapOn: "Fetch"
- waitForAnimationToEnd

# Verify error state is shown
- extendedWaitUntil:
    visible: "Import Failed"
    timeout: 10000

# Verify retry option
- assertVisible: "Try Again"

# Tap Try Again to go back to pick stage
- tapOn: "Try Again"
- waitForAnimationToEnd

# Verify we're back on the pick screen
- extendedWaitUntil:
    visible: "Choose File"
    timeout: 5000

# Cancel back
- tapOn: "Cancel"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000
