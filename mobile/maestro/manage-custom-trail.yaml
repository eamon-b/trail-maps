appId: com.trailcompanion.app
---
# Manage a custom trail. Rename/delete moved to the Contribute tab's
# "My data" surface (P1 PR E); the overview now points there.
# Prerequisites: A custom trail must already be imported (steps are optional if not)

- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Look for a custom trail badge in the list (indicates a custom trail exists)
- assertVisible:
    text: "Custom"
    optional: true

# If a custom trail exists, tap on it to open overview
- tapOn:
    text: "Custom"
    optional: true
- waitForAnimationToEnd

# On the overview screen, verify the custom trail section + management hint
- assertVisible:
    text: "CUSTOM TRAIL"
    optional: true
- assertVisible:
    text: "Rename or delete this trail from the Contribute tab (My data)."
    optional: true

# Go back to trail list (use Back button if on overview, otherwise already on list)
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Select a Trail"

# The management home: Contribute tab -> My data
- tapOn: "Contribute"
- waitForAnimationToEnd
- assertVisible: "My data"
- assertVisible: "MY TRAILS"

# Rename/Delete actions are present when a custom trail exists
- assertVisible:
    text: "Rename"
    optional: true
- assertVisible:
    text: "Delete"
    optional: true
