appId: com.trailcompanion.app
---
# Manage a custom trail: view details, edit name, delete
# Prerequisites: A custom trail must already be imported

- launchApp
- waitForAnimationToEnd
- assertVisible: "Select a Trail"

# Look for a custom trail badge in the list (indicates a custom trail exists)
- assertVisible:
    text: "Custom"
    optional: true

# If a custom trail exists, tap on it to open overview
- tapOn:
    text: "Custom"
    optional: true
- waitForAnimationToEnd

# On the overview screen, verify custom trail management section
- assertVisible:
    text: "CUSTOM TRAIL"
    optional: true

# Verify Edit button is available for custom trails
- assertVisible:
    text: "Edit"
    optional: true

# Verify Delete Trail option is available
- assertVisible:
    text: "Delete Trail"
    optional: true

# Go back to trail list
- tapOn: "Back"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
