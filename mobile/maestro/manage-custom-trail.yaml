appId: com.trailcompanion.app
---
# Manage a custom trail: view details, verify management options
# Prerequisites: A custom trail must already be imported (steps are optional if not)

- launchApp
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Look for a custom trail badge in the list (indicates a custom trail exists)
- assertVisible:
    text: "Custom"
    optional: true

# If a custom trail exists, tap on it to open overview
- tapOn:
    text: "Custom"
    optional: true
- waitForAnimationToEnd

# On the overview screen, verify custom trail management section
- assertVisible:
    text: "CUSTOM TRAIL"
    optional: true

# Verify Edit button is available for custom trails
- assertVisible:
    text: "Edit"
    optional: true

# Verify Delete Trail option is available
- assertVisible:
    text: "Delete Trail"
    optional: true

# Go back to trail list (use Back button if on overview, otherwise already on list)
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
