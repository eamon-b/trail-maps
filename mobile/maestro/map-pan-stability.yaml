appId: com.trailcompanion.app
---
# Regression: the map must remain alive while its online style resolves and
# after repeated viewport changes. This catches native renderer exits that a
# React error boundary cannot intercept.
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View Map"
    timeout: 30000
- tapOn: "View Map"
- waitForAnimationToEnd

# TrailMap now resolves one stable style before mounting. Do not start the
# gesture sequence while its safe loading placeholder is still visible.
- extendedWaitUntil:
    notVisible: "Loading map…"
    timeout: 30000

- swipe:
    start: "70%, 42%"
    end: "30%, 42%"
- waitForAnimationToEnd
- swipe:
    start: "30%, 42%"
    end: "70%, 42%"
- waitForAnimationToEnd
- swipe:
    start: "50%, 65%"
    end: "50%, 30%"
- waitForAnimationToEnd
- swipe:
    start: "50%, 30%"
    end: "50%, 65%"
- waitForAnimationToEnd
- swipe:
    start: "75%, 55%"
    end: "25%, 35%"
- waitForAnimationToEnd
- swipe:
    start: "25%, 35%"
    end: "75%, 55%"
- waitForAnimationToEnd

# If MapLibre terminated the process, this native toolbar action disappears
# and the flow fails here.
- assertVisible: "View waypoint datasheet"
- takeScreenshot: map-pan-stability
