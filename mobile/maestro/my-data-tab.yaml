appId: com.trailcompanion.app
---
# Verify the Contribute tab is the "My data" management surface (P1 PR E):
# My waypoints / My trails / My routes sections, GPX export affordances,
# the Import GPX entry point, and the honest v2 community footer.
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate to Contribute tab
- tapOn: "Contribute"
- waitForAnimationToEnd

# Section headers
- assertVisible: "My data"
- assertVisible: "MY WAYPOINTS"
- scrollUntilVisible:
    element:
      text: "MY TRAILS"
    direction: DOWN
    timeout: 10000
- assertVisible: "Import GPX Trail"
- scrollUntilVisible:
    element:
      text: "MY ROUTES"
    direction: DOWN
    timeout: 10000

# Honest v2 footer
- scrollUntilVisible:
    element:
      text: "coming in v2"
    direction: DOWN
    timeout: 10000
- takeScreenshot: my-data-tab
