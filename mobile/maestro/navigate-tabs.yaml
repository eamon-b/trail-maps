appId: com.trailcompanion.app
---
# Verify all tabs are reachable
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Navigate to Hike tab
- tapOn: "Hike"
- waitForAnimationToEnd

# Navigate to Contribute tab
- tapOn: "Contribute"
- waitForAnimationToEnd

# Navigate back to Plan tab
- tapOn: "Plan"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
