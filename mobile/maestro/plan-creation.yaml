appId: com.trailcompanion.app
---
# Verify plan creation screen opens with expected form elements
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Open first trail card
- tapOn: "View trail →"
- waitForAnimationToEnd

# Go back to trail list
- pressKey: back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000

# Tap "+ New Plan" on the first trail card
- tapOn: "+ New Plan"
- waitForAnimationToEnd

# Wait for plan creation screen to load
- extendedWaitUntil:
    visible: "New Plan"
    timeout: 10000

# Verify plan creation screen opened
- assertVisible: "Plan Name"
- assertVisible: "Direction"
- assertVisible: "NOBO"
- assertVisible: "SOBO"

# Dismiss keyboard (autoFocus on plan name input opens it) and scroll to footer
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create Plan"
    direction: DOWN
    timeout: 5000

# Cancel back to trail list
- tapOn: "Cancel"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000
