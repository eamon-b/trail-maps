appId: com.trailcompanion.app
---
# Verify plan creation screen opens with expected form elements
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Open first trail card
- tapOn: "View trail →"
- waitForAnimationToEnd

# Go back to trail list
- pressKey: back
- waitForAnimationToEnd

# Tap "+ New Plan" on the first trail card
- tapOn: "+ New Plan"
- waitForAnimationToEnd

# Verify plan creation screen opened
- assertVisible: "New Plan"
- assertVisible: "Plan Name"
- assertVisible: "Direction"
- assertVisible: "NOBO"
- assertVisible: "SOBO"
- assertVisible: "Create Plan"

# Cancel back to trail list
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
