appId: com.trailcompanion.app
---
# Verify plan creation and basic editing flow
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View Map"
    timeout: 30000

# Open plan creation for first trail
- tapOn: "+ New Plan"
- waitForAnimationToEnd

# Wait for create screen to load
- extendedWaitUntil:
    visible: "New Plan"
    timeout: 10000

# Dismiss keyboard (autoFocus on plan name) and find Create Plan button
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create Plan"
    direction: DOWN
    timeout: 5000

# Create a plan with default settings
- tapOn: "Create Plan"
- waitForAnimationToEnd

# Verify plan screen loaded with tab bar
- extendedWaitUntil:
    visible: "Days"
    timeout: 10000

# Open the stop selector via FAB
- tapOn: "+ Add Stops"
- waitForAnimationToEnd

# Verify stop selector content
- extendedWaitUntil:
    visible: "Select Stops"
    timeout: 5000

# Go back
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
