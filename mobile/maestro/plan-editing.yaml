appId: com.trailcompanion.app
---
# Verify plan creation and basic editing flow
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View trail →"
    timeout: 30000

# Open plan creation for first trail
- tapOn: "+ New Plan"
- waitForAnimationToEnd
- assertVisible: "New Plan"

# Create a plan with default settings
- tapOn: "Create Plan"
- waitForAnimationToEnd

# Verify plan screen loaded with tab bar
- extendedWaitUntil:
    visible: "Days"
    timeout: 5000

# Open the stop selector via FAB
- tapOn: "+ Add Stops"
- waitForAnimationToEnd

# Verify stop selector content
- assertVisible: "Select Stops"

# Go back
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
