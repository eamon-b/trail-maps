appId: com.trailcompanion.app
---
# Verify multiple trails render and the list is scrollable
- launchApp
- waitForAnimationToEnd
- assertVisible: "Select a Trail"

# Verify first trail is visible
- assertVisible: "Australian Alps Walking Track"

# Scroll down to reveal more trails
- scrollUntilVisible:
    element: "Larapinta Trail"
    direction: DOWN

# Verify default offline maps state
- assertVisible: "No offline maps"
