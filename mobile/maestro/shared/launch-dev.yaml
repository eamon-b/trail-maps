appId: com.tracknotes.app
---
# Shared launch flow.
#
# `clearState` + the dev-client deep link. The app is built with
# `expo-dev-client` (added 2026-08-20, issue #32), so
# `tracknotes://expo-development-client/?url=…` is handled by the dev launcher
# and points the app at the Metro server named in the URL. `clearState` then
# costs nothing: it wipes install-level state (downloaded tiles, the SecureStore
# session, SQLite rows) and the deep link re-supplies the bundle URL, so every
# flow starts from a genuinely fresh install.
#
# NOTE: on a plain React Native debug build (one WITHOUT the `expo-dev-client`
# package) this deep link is silently ignored and `clearState` drops the app back
# to the build-time default `10.0.2.2:8081` — which may be a different Metro than
# the one you are testing. That was the state of the emulator build before issue
# #32; see mobile/maestro/README.md if you ever hit it again.
- clearState
- openLink: "tracknotes://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"

# The dev menu welcome ("Continue" button) can appear on the first launch after
# install, so dismiss it only if it shows up.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - pressKey: back

# Wait for the app to reach the guide list.
- extendedWaitUntil:
    visible: "My Guides"
    timeout: 60000
