appId: com.trailcompanion.app
---
# Quick smoke test: launch → verify data loaded → navigate tabs → open trail
- launchApp
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 10000

# Wait for trail list to render (data loads async from SQLite)
- extendedWaitUntil:
    visible: "View trail →"
    timeout: 10000

# Verify trail list rendered (at least one trail with a km value)
- assertVisible:
    text: "km"

# Navigate through tabs
- tapOn: "Hike"
- waitForAnimationToEnd
- tapOn: "Contribute"
- waitForAnimationToEnd
- tapOn: "Plan"
- waitForAnimationToEnd

# Open first trail
- tapOn: "View trail →"
- waitForAnimationToEnd

# Go back
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
