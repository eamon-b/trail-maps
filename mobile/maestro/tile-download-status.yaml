appId: com.trailcompanion.app
---
# Verify trail overview shows offline maps section with download status
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Open first trail
- tapOn: "Trail details"
- waitForAnimationToEnd

# Scroll down to find the offline maps section
- scrollUntilVisible:
    element:
      text: "OFFLINE MAPS"
    direction: DOWN

# Verify offline maps section content
- assertVisible: "OFFLINE MAPS"

# Go back
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "Select a Trail"
