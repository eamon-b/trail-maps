appId: com.trailcompanion.app
---
# Verify trail overview screen renders all content sections
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Open first trail
- tapOn: "Trail details"
- waitForAnimationToEnd

# Wait for trail data to load
- extendedWaitUntil:
    visible: "Australian Alps Walking Track"
    timeout: 15000

# Verify stats labels
- assertVisible: "km"
- assertVisible: "m ascent"
- assertVisible: "m descent"
- assertVisible: "waypoints"

# Verify elevation range section
- assertVisible: "ELEVATION RANGE"

# Scroll to waypoints section (below datasheet on overview)
- scrollUntilVisible:
    element:
      text: "WAYPOINTS"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "Campsites"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Water sources"
    direction: DOWN
    timeout: 5000

# Verify offline maps section
- scrollUntilVisible:
    element:
      text: "OFFLINE MAPS"
    direction: DOWN
    timeout: 10000

# Verify Open Map button (below fold, needs scroll)
- scrollUntilVisible:
    element:
      text: "Open Map"
    direction: DOWN
    timeout: 10000

# Scroll back up to verify back navigation link
- scrollUntilVisible:
    element:
      text: "Back"
    direction: UP
    timeout: 10000
