appId: com.trailcompanion.app
---
# Full navigation flow: trail list → overview → map → back → back
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View trail →"
    timeout: 30000

# Open first trail overview
- tapOn: "View trail →"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Open Map"
    direction: DOWN
    timeout: 10000

# Tap Open Map to navigate to map screen
- tapOn: "Open Map"
- waitForAnimationToEnd

# Press back to return to overview
- pressKey: back
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Open Map"
    direction: DOWN
    timeout: 10000

# Press back to return to trail list
- pressKey: back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 5000
