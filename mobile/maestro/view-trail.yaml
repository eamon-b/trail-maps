appId: com.trailcompanion.app
---
# Verify the primary trail-card action navigates directly to the map
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "Select a Trail"
    timeout: 30000

# Tap the first trail card's primary map action
- tapOn: "View Map"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "View waypoint datasheet"
    timeout: 15000
