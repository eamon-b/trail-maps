appId: com.trailcompanion.app
---
# Regression: after dismissing the waypoint detail sheet, panning the map
# must not resurrect the selection or destabilise the screen (the old
# "snaps back to selected point" family of bugs — issue #6, Phase 1).
#
# The GPS-tick camera-fight variant of the bug needs a live location and is
# covered by hike-live-distance.yaml plus manual `adb emu geo fix` checks.
- runFlow: shared/launch-dev.yaml
- extendedWaitUntil:
    visible: "View trail →"
    timeout: 30000

# Open the first trail (AAWT) and its map
- tapOn: "View trail →"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Open Map"
    direction: DOWN
    timeout: 10000
- tapOn: "Open Map"
- waitForAnimationToEnd

# Select a waypoint via datasheet → "Show on map"
- tapOn: "View waypoint datasheet"
- extendedWaitUntil:
    visible: "O'Sheas Mill Site"
    timeout: 15000
- tapOn: "O'Sheas Mill Site"
- waitForAnimationToEnd
- tapOn: "Show on map"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Show on elevation profile"
    timeout: 10000

# Dismiss the sheet
- tapOn: "Dismiss waypoint info"
- waitForAnimationToEnd
- assertNotVisible: "Show on elevation profile"

# Pan away — selection must stay dismissed, screen must stay stable
- swipe:
    start: "50%, 40%"
    end: "20%, 40%"
- waitForAnimationToEnd
- assertNotVisible: "Show on elevation profile"
- assertNotVisible: "O'Sheas Mill Site"

# Second pan for good measure (the old bug often appeared on the next move)
- swipe:
    start: "50%, 40%"
    end: "80%, 40%"
- waitForAnimationToEnd
- assertNotVisible: "Show on elevation profile"
- takeScreenshot: waypoint-dismiss-pan
