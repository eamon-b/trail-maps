<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan — Imported trail - Trail Maps</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="./trails/plan-page.css">
  <link rel="stylesheet" href="./my-trails.css">
</head>
<body>
  <!-- Shown when ?id= names a trail this browser no longer has. -->
  <div id="plan-missing" hidden>
    <h2>Trail not found</h2>
    <p class="import-note">
      This trail isn't in this browser's storage. Imported trails live on the device
      that created them, and clearing site data removes them.
    </p>
    <p class="import-note">
      <a href="./upload.html">Import a GPX</a> · <a href="./">Back to all trails</a>
    </p>
  </div>

  <div id="small-screen-msg">
    <p>The trip planner requires a screen width of at least 900px.</p>
    <p><a id="small-screen-back" href="./">← Back to trail</a></p>
  </div>

  <!-- @plan-shell -->

  <script type="module" src="./my-plan.ts"></script>
</body>
</html>
