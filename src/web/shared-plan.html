<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared plan - Trail Maps</title>
  <!-- A shared plan is somebody's private link: keep it out of search results. -->
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="./trails/plan-page.css">
  <link rel="stylesheet" href="./my-trails.css">
</head>
<body>
  <!-- Shown when ?s= names no readable plan, or a trail this site does not carry. -->
  <div id="plan-missing" hidden>
    <h2 id="plan-missing-title">Plan not found</h2>
    <p class="import-note" id="plan-missing-detail">
      This link is no longer shared, or it was never valid.
    </p>
    <p class="import-note">
      <a href="./">Back to all trails</a>
    </p>
  </div>

  <div id="small-screen-msg">
    <p>The trip planner requires a screen width of at least 900px.</p>
    <p><a href="./">← Back to trails</a></p>
  </div>

  <!-- @plan-shell -->

  <script type="module" src="./shared-plan.ts"></script>
</body>
</html>
