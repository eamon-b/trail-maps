<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan — {{TRAIL_NAME}} - Trail Maps</title>
  <link rel="stylesheet" href="../../styles.css">
  <!-- Applies the saved theme before first paint so the page never flashes. See theme.ts. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var pref = 'system';
      try { pref = localStorage.getItem('trail-maps-theme') || 'system'; } catch (e) { /* storage disabled */ }
      if (pref !== 'light' && pref !== 'dark') pref = 'system';
      root.dataset.themePref = pref;
      root.dataset.theme = pref === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : pref;
    })();
  </script>
  <script type="module" src="../../theme.ts"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="../plan-page.css">
</head>
<body>
  <div id="small-screen-msg">
    <p>The trip planner requires a screen width of at least 900px.</p>
    <p><a href="index.html">← Back to trail</a></p>
  </div>

  <div id="plan-shell">
    <!-- Header bar -->
    <div id="plan-header">
      <a href="index.html" class="back-link">← Trail</a>
      <span class="trail-title">{{TRAIL_NAME}}</span>
      <input type="text" id="plan-name-input" placeholder="Plan name…" maxlength="80" />
      <div id="plan-date-group">
        <label for="plan-start-date" style="font-size:0.875rem;">Start:</label>
        <input type="date" id="plan-start-date" />
      </div>
      <button type="button" id="direction-toggle" title="Toggle hiking direction">
        <span class="direction-arrows" aria-hidden="true">⇄</span>
        <span id="direction-label">NOBO</span>
      </button>
      <span id="save-status">Saved</span>
      <div data-theme-toggle></div>
    </div>

    <!-- Three-panel body -->
    <div id="plan-body">

      <!-- Left panel -->
      <div id="left-panel">
        <div id="left-tabs">
          <button class="tab-btn active" data-tab="days">Days</button>
          <button class="tab-btn" data-tab="stops">Stops</button>
        </div>

        <!-- Days tab -->
        <div id="tab-days" class="tab-panel active">
          <div id="days-list">
            <p class="days-empty">Add stops in the Stops tab to build your day plan.</p>
          </div>

          <!-- Resupply section -->
          <div class="collapse-section" id="resupply-section" hidden>
            <div class="collapse-header" data-collapse="resupply">
              Resupply <span class="collapse-chevron open">▶</span>
            </div>
            <div class="collapse-body open" id="resupply-body"></div>
          </div>

          <!-- Water carry section -->
          <div class="collapse-section" id="water-section" hidden>
            <div class="collapse-header" data-collapse="water">
              Water carry <span class="collapse-chevron open">▶</span>
            </div>
            <div class="collapse-body open" id="water-body"></div>
          </div>
        </div>

        <!-- Stops tab -->
        <div id="tab-stops" class="tab-panel">
          <div id="stops-search">
            <input type="text" id="stops-filter" placeholder="Filter waypoints…" autocomplete="off" />
          </div>
          <div id="stops-list"></div>
        </div>
      </div>

      <!-- Center panel -->
      <div id="center-panel">
        <div id="plan-map"></div>
        <div id="elevation-section">
          <canvas id="elevation-canvas"></canvas>
          <div id="elev-hover-line"></div>
          <div id="elev-hover-tooltip"></div>
        </div>
      </div>

      <!-- Right panel -->
      <div id="right-panel">
        <div id="datasheet-header">
          <p id="datasheet-title">All waypoints</p>
          <p id="datasheet-subtitle"></p>
        </div>
        <div id="datasheet-body"></div>
      </div>

    </div><!-- #plan-body -->
  </div><!-- #plan-shell -->

  <script type="module">
    import { initPlanViewer } from '../plan-viewer.ts';
    initPlanViewer('{{TRAIL_ID}}');
  </script>
</body>
</html>
