name = "farout-comments"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Public hostname: https://api.contour-map-tiles.net (zone: contour-map-tiles.net).
# Deploy with: npm run deploy (requires `wrangler login`).
#
# workers.dev is kept alive alongside the custom domain so already-shipped
# mobile builds (which have https://farout-comments.aus-map-data.workers.dev
# inlined at bundle time) keep working. Do not flip to false until no released
# build points at the workers.dev URL.
workers_dev = true

[[routes]]
pattern = "api.contour-map-tiles.net"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "farout-comments"
database_id = "2d1504b2-13c4-422b-829b-af3a3536a5bd"

# Photo attachments live in R2. This is the same bucket the map tiles use; photos
# go under the `comments/` prefix and are read publicly via PHOTOS_PUBLIC_BASE.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "aus-map-data"

[vars]
# Public read base for R2 objects: the bucket's custom domain (the old
# pub-….r2.dev URL still resolves but is rate-limited and uncached). The worker
# returns full URLs built from this + the object key. Tests override it.
PHOTOS_PUBLIC_BASE = "https://data.contour-map-tiles.net"
