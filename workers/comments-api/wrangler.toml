name = "tracknotes-comments"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Public hostname: https://api.contour-map-tiles.net (zone: contour-map-tiles.net).
# Deploy with: npm run deploy (requires `wrangler login`).
#
# The custom domain is the only hostname: the workers.dev URL was retired
# (issue #159) once no distributed build predated the custom domains
# (2026-08-22), so every shipped build points at api.contour-map-tiles.net.
workers_dev = false

[[routes]]
pattern = "api.contour-map-tiles.net"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tracknotes-comments"
database_id = "7ebd1642-b752-4184-904e-54bfa48b658f"

# Photo attachments live in R2. This is the same bucket the map tiles use; photos
# go under the `comments/` prefix and are read publicly via PHOTOS_PUBLIC_BASE.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "aus-map-data"

# Community-route maintenance (`runCommunityMaintenance` in src/community.ts):
# retries de-attributions an account deletion left pending, re-runs AI
# reviews stuck at `pending`, and fetches OSM POIs for routes that have none
# yet (`enrichCommunityRoutePois`), a bounded batch each run.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI: the Llama Guard screen of every new comment and shared waypoint
# (`src/content-review.ts`), and the AI Gateway URL the Anthropic calls take.
[ai]
binding = "AI"
# Always remote (Workers AI has no local model); tests turn remote bindings off.
remote = true

[vars]
# Public read base for R2 objects: the bucket's custom domain (the old
# pub-….r2.dev URL still resolves but is rate-limited and uncached). The worker
# returns full URLs built from this + the object key. Tests override it.
PHOTOS_PUBLIC_BASE = "https://data.contour-map-tiles.net"

# Origin of the deployed web site: the Vercel deploy at tracknotes.info (moved
# from trail-maps.vercel.app). Share links are built as
# `SITE_BASE/shared-plan.html?s=<shareId>`, so this must change the day the site
# moves or every link minted after the move is dead. Tests override it.
SITE_BASE = "https://tracknotes.info"

# Overpass instances the community-route POI enrichment asks, in order
# (comma-separated https URLs; `src/community-pois.ts`). Each query goes to the
# instance that answered last, then the next one on a failure. EMPTY = OFF.
# It is on: the account is on Workers Paid (2026-10-20), whose 15-minute cron
# CPU limit covers the enrichment's tens to hundreds of ms per route; on Workers
# Free (10 ms) it would have to be switched off again
# (docs/architecture/workers.md, "community route POIs"). Every instance listed receives each live
# community route's outline: name its operator in docs/privacy-policy.md and
# public/privacy.html before adding one (both list the three above).
# Mirrors come and go: see docs/architecture/build-scripts.md (fetch-pois).
OVERPASS_ENDPOINTS = "https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter,https://overpass.kumi.systems/api/interpreter"

# The Cloudflare AI Gateway every model call goes through (Anthropic and Workers
# AI): request logs, spend and rate limits. EMPTY = OFF (calls go straight to
# the provider). Create the gateway first (dashboard: AI → AI Gateway), then
# put its name here; an Authenticated Gateway (the auto-created `default` one
# is) also needs the AI_GATEWAY_TOKEN secret below, or every review fails.
# Steps: docs/architecture/workers.md ("Comment and waypoint review").
AI_GATEWAY_ID = ""

# Secrets (not in this file): set with `wrangler secret put <NAME>`.
#   ANTHROPIC_API_KEY — the community-route AI review (src/community-review.ts)
#     and the review of reported or screen-flagged comments and shared waypoints
#     (src/content-review.ts). `wrangler secret put ANTHROPIC_API_KEY`.
#     Optional: without it every route review is recorded as `skipped` and
#     routes stay Unverified until an admin looks, and comments and waypoints
#     are neither screened nor reviewed (three reports still hide one).
#   AI_GATEWAY_TOKEN — only if the gateway is an Authenticated Gateway.
