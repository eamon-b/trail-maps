name = "contour-tiles"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Kept alive alongside the custom domain below so already-shipped mobile builds
# (which have the workers.dev URL inlined at bundle time) keep working. Do not
# flip to false until no released build points at
# https://contour-tiles.aus-map-data.workers.dev.
workers_dev = true

# --- Custom domain (enables real edge caching) --------------------------------
# The Worker calls caches.default, which is a NO-OP on *.workers.dev: that cache
# is zone-level and workers.dev is a shared zone. Serving from this custom
# domain — a zone in this account — makes it live, with no code changes.
#
# Public hostnames for the tileset (zone: contour-map-tiles.net):
#   contour-map-tiles.net       → docs + demo (Cloudflare Pages)
#   data.contour-map-tiles.net  → R2 bucket: the PMTiles archive itself
#   tiles.contour-map-tiles.net → this Worker: /{source}/{z}/{x}/{y}.pbf
[[routes]]
pattern = "tiles.contour-map-tiles.net"
custom_domain = true

[[r2_buckets]]
binding = "TILES_BUCKET"
bucket_name = "aus-map-data"

# Optionally lock CORS down in production:
# [vars]
# ALLOWED_ORIGIN = "https://trailmaps.example.com"
